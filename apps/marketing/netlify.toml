# Netlify site config for the marketing app specifically — this repo hosts
# two independent Netlify sites (docs/15-MARKETING-SITE-PWA-SCOPING.md §7:
# involveme.com for this app, app.involveme.com for the PWA later), so each
# app's netlify.toml lives inside that app's own directory, not the repo
# root, and each Netlify site is configured with this directory as its
# "Base directory" in the dashboard.
#
# Creating the actual Netlify site / connecting the repo / DNS is a
# one-time dashboard action outside this repo's scope.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
