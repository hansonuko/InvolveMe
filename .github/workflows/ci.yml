name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Gates test-wallet-code below to PRs that could plausibly touch it — a
  # docs-only or mobile-UI-only PR (the majority of this project's history
  # so far) has no reason to spend CI minutes and live Flutterwave API
  # calls re-running the wallet suite. lint-and-typecheck/migrate-staging
  # stay unconditional (cheap, and typechecking genuinely covers the whole
  # repo regardless of what changed).
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter falls back to the GitHub API to diff base/head when
    # it can't do it from the local git history alone (shallow checkout by
    # default) — without this, that fallback 403s with "Resource not
    # accessible by integration" on repos where the default GITHUB_TOKEN
    # permissions aren't already broad enough, which silently skips
    # test-wallet-code below (a skip, not a pass) instead of failing loudly.
    # Read-only, scoped to this job only.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      wallet: ${{ steps.filter.outputs.wallet }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wallet:
              - 'supabase/functions/**'
              - 'supabase/migrations/**'
              - 'supabase/tests/**'
              - 'packages/payments/**'

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # The pure-crypto half of the e2ee suite: HKDF vectors, the Double Ratchet
  # core, media key wrapping, and the three regression tests for bugs that
  # each wedged real conversations (bootstrap replay, concurrent bootstrap,
  # session convergence). No DB, no network, no secrets — just the crypto in
  # apps/mobile/lib/e2ee, exercised against itself.
  #
  # Deliberately its own job rather than a step in test-wallet-code: that one
  # is gated on `changes.outputs.wallet`, whose paths-filter covers
  # supabase/** and packages/payments/** but NOT apps/mobile/lib/e2ee/**. A PR
  # editing only the ratchet — exactly the change these tests exist to catch —
  # would skip them entirely. This job is unconditional for the same reason
  # lint-and-typecheck is.
  #
  # Node 22, not the 20 the other jobs pin: these tests are .ts run directly,
  # which needs the type-stripping that only landed unflagged in 22.18.
  e2ee-crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2EE crypto tests (no DB, no secrets)
        run: npm run test:e2ee-crypto:ci

  # Added 2026-09-15 (docs/00-SESSION-HANDOFF.md session 12) after a bug in
  # the webhook-flutterwave <-> buy-credit path recurred three times across
  # separate sessions, each time only caught because someone happened to run
  # the test suite by hand — CLAUDE.md has required ledger-conservation +
  # concurrency tests for any balance-mutating function since Phase 1, but
  # nothing ever enforced that requirement at merge time. This job is that
  # enforcement: runs test:db (schema/ledger-conservation, no external
  # calls) and test:functions:ci (every Edge Function test except
  # submit-kyc, which costs real money — ~₦45 — per real run and stays
  # manual-only, same as it already was locally) against the real linked
  # dev Supabase project and LIVE Flutterwave credentials, on every PR and
  # push to main. Deliberately does NOT run test:deployed here — those
  # tests assert against whatever is currently deployed to production,
  # which is a fact about the live environment, not about this PR's code;
  # running them post-deploy (as this project's sessions already do by
  # hand) is the meaningful check, not pre-merge.
  test-wallet-code:
    runs-on: ubuntu-latest
    needs: [changes, lint-and-typecheck]
    if: needs.changes.outputs.wallet == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: DB-level tests (ledger conservation, concurrency)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:db:ci

      - name: Edge Function tests (real dev DB + live Flutterwave, excludes submit-kyc)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          # Same underlying secret value as SUPABASE_JWT_SECRET above, just
          # exposed under a second env var name too — _shared/
          # linkedDeviceToken.ts reads LINKED_DEVICE_JWT_SECRET
          # specifically (not SUPABASE_JWT_SECRET), because Supabase's own
          # `secrets set` rejects any name starting with `SUPABASE_` on the
          # deployed project (reserved for platform-injected vars) — see
          # docs/12-LINKED-DEVICES-WEB-SCOPING.md M4's note for the full
          # finding. CI spawns the function locally via `deno run`, which
          # has no such restriction, but still needs this exact var name to
          # match what the function code actually reads.
          LINKED_DEVICE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          FLW_CLIENT_ID: ${{ secrets.FLW_CLIENT_ID }}
          FLW_CLIENT_SECRET: ${{ secrets.FLW_CLIENT_SECRET }}
          FLW_ENVIRONMENT: ${{ secrets.FLW_ENVIRONMENT }}
          FLW_WEBHOOK_SECRET_HASH: ${{ secrets.FLW_WEBHOOK_SECRET_HASH }}
          FLW_TRANSFER_SENDER_ID: ${{ secrets.FLW_TRANSFER_SENDER_ID }}
          CRON_INTERNAL_SECRET: ${{ secrets.CRON_INTERNAL_SECRET }}
          TWO_STEP_PIN_PEPPER: ${{ secrets.TWO_STEP_PIN_PEPPER }}
          # Optional — moderation-functions.test.js fails open (send still
          # succeeds) when unset, same as this app does in production
          # before a real key is added. Add OPENAI_API_KEY as a repo
          # secret to also exercise the true/false-positive assertions.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run test:functions:ci

      - name: Fraud-infra tests (ledger conservation, concurrency)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:fraud:ci

      - name: Reserve buffer / chargeback-clawback tests (ledger conservation, concurrency)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:chargeback:ci

      - name: Admin RBAC tests (grant locks, append-only audit log, concurrency)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:admin:ci

      - name: Admin reports/fraud queue tests (grant locks, freeze/suspend, resolution)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:admin-reports:ci

      - name: Admin pricing config tests (grant locks, attribution, guards)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:admin-pricing:ci

      - name: Admin dual-approval tests (self-approval block, matching permissions, single-use consume)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:admin-dual-approval:ci

      - name: Admin manual-adjustment tests (ledger conservation, concurrency)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:admin-manual-adjustment:ci

      - name: Admin platform bank accounts / earnings conversion tests (dual-approval, ledger conservation, concurrency)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:admin-platform-bank-accounts:ci

      - name: Admin platform withdrawal tests (dual-approval, ledger conservation, idempotent retry, concurrency)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:admin-platform-withdrawal:ci

      - name: Admin message pricing strategy tests (pure functions, dual-approval, dispatch)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:admin-message-pricing-strategy:ci

      - name: Admin account management tests (dual-approval account status, role replacement, concurrency)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:admin-account-management:ci

      - name: Linked devices tests (QR-pairing concurrency, 5-device cap, revocation)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:linked-devices:ci

  # Placeholder — activates once supabase/migrations exist (Phase 1).
  # Runs schema migrations against the staging Supabase project on merge to
  # main, per docs/01-ARCHITECTURE.md "Environments".
  migrate-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: No migrations yet
        run: echo "supabase/migrations is empty until Phase 1 — nothing to run."
