name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Placeholder — activates once supabase/migrations exist (Phase 1).
  # Runs schema migrations against the staging Supabase project on merge to
  # main, per docs/01-ARCHITECTURE.md "Environments".
  migrate-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: No migrations yet
        run: echo "supabase/migrations is empty until Phase 1 — nothing to run."
